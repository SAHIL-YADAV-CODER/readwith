name: Deploy to InfinityFree (Direct FTP Credentials)

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload files to InfinityFree via lftp
        run: |
          HOST="ftpupload.net"
          USER="if0_40614929"
          PASS="rduRkb3BFS"
          REMOTE_PATH="/htdocs/"

          echo "Deploying to ${HOST}${REMOTE_PATH} ..."

          # lftp -u "user","pass" host -e "commands; quit"
          # - set ssl:verify-certificate no  (if your host uses a self-signed cert)
          # - mirror -R ... uploads local repo to remote path
          # Note: remove --delete if you don't want deletions on remote
          lftp -u "${USER}","${PASS}" "${HOST}" -e "set ssl:verify-certificate no; mirror -R --only-newer --parallel=2 --delete . \"${REMOTE_PATH}\"; quit"
